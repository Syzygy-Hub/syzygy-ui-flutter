name: syzygy_ui_flutter
description: "Production-ready Flutter component library with design tokens, Dark Mode, and zero third-party dependencies"
version: 2.0.0
homepage: https://github.com/Syzygy-Hub/syzygy-ui-flutter

environment:
  # Color.withValues() (used in ShimmerView) was introduced in Flutter 3.27 / Dart 3.6,
  # alongside the deprecation of Color.withOpacity() — this is the true minimum, not 3.10.
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
