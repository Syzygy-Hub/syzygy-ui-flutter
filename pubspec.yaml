name: syzygy_ui_flutter
description: "Production-ready Flutter component library with design tokens, Dark Mode, and zero third-party dependencies"
version: 2.4.0
homepage: https://github.com/Syzygy-Hub/syzygy-ui-flutter

environment:
  # RadioGroup (used in RadioButtonInput, replacing deprecated Radio.groupValue/
  # Radio.onChanged) was introduced in Flutter 3.35.0 / Dart 3.9.0 — the latest-
  # introduced of the APIs this library depends on, so it's the binding floor:
  # DropdownButtonFormField.initialValue needs 3.33.0+ and Switch.activeThumbColor
  # needs 3.32.0+, both older than the RadioGroup requirement.
  # (Color.withValues(), used in ShimmerView, only needed 3.27.0 / Dart 3.6.0.)
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
