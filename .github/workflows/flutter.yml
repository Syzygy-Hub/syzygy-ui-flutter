name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch shared Dart analysis config
        run: curl -fsSL https://raw.githubusercontent.com/Syzygy-Hub/syzygy-lint-config/v1.0.0/analysis_options.yaml -o analysis_options.yaml

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Build web (smoke build)
        run: flutter build web
        working-directory: example
